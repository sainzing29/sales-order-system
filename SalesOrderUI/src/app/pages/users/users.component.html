<div class="container mt-4">

  <div class="card p-4 so-card">

    <h3 class="mb-4">Users</h3>

    @if (loadError) {

      <div
        class="alert alert-danger mb-0"
        role="alert">

        {{ loadError }}
      </div>
    }

    @if (loading) {

      <div class="d-flex align-items-center gap-2 text-muted py-3">

        <span
          class="spinner-border spinner-border-sm"
          role="status"
          aria-hidden="true"></span>

        <span>Loading…</span>
      </div>
    } @else if (!users.length && !loadError) {

      <div class="alert alert-info mb-0">
        No users found.
      </div>
    } @else if (users.length) {

      <div class="so-table-wrap">

        <table class="table table-bordered so-table mb-0">

          <thead>

            <tr>

              <th
                scope="col"
                class="so-th so-th--qty">

                Id
              </th>

              <th
                scope="col"
                class="so-th so-th--vendor">

                Username
              </th>

              <th
                scope="col"
                class="so-th so-th--vendor">

                Role
              </th>
            </tr>

          </thead>

          <tbody>

            <tr *ngFor="let user of users">

              <td class="so-cell-readonly sol-mono">

                {{ user.id }}
              </td>

              <td>{{ user.username }}</td>

              <td>{{ user.roleName }}</td>
            </tr>

          </tbody>

        </table>

      </div>
    }

  </div>

</div>
